[project]
name = "e-coomerce"
version = "0.1.0"
description = ""
authors = [{ name = "Maquina Web", email = "arte@maquinaweb.com.br" }]
requires-python = "~=3.13"
readme = "README.md"
dependencies = [
    "django~=5.2",
    "djangorestframework>=3.15.1,<4",
    "django-filter~=24.2",
    "python-decouple~=3.8",
    "drf-nested-routers>=0.94.1,<0.95",
    "drf-spectacular>=0.27.2,<0.28",
    "django-debug-toolbar>=4.4.2,<5",
    "django-storages>=1.14.4,<2",
    "drf-writable-nested>=0.7.0,<0.8",
    "django-cors-headers>=4.4.0,<5",
    "sentry-sdk[django]==2.30.0",
    "requests>=2.32.3",
    "pillow>=12.0.0",
    "maquinaweb-shared-auth==0.2.39",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.9,<3",
    "zappa>=0.60.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
